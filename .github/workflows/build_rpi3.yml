name: BSP-RPi3

on:
    push:
    pull_request:
    schedule:
        - cron: "0 5 * * *"

jobs:
    build:
        name: Build kernels
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@v4
            - name: Set up Rust tools
              run: |
                  rustup target add aarch64-unknown-none-softfloat
                  rustup component add llvm-tools
                  cargo install cargo-binutils
            - name: Run
              run: BSP=rpi3 make
