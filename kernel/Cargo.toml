[package]
name = "mingo"
version = "0.16.0"
authors = ["Andre Richter <andre.o.richter@gmail.com>"]
edition = "2021"

[features]
default = []
bsp_rpi3 = ["tock-registers"]
bsp_rpi4 = ["tock-registers"]
test_build = ["qemu-exit"]
boot_trace = []
chainloader = []

##--------------------------------------------------------------------------------------------------
## Dependencies
##--------------------------------------------------------------------------------------------------

[dependencies]
unwinding = { version = "0.2", default-features = false, features = ["unwinder", "fde-static", "hide-trace"] }

# Optional dependencies
tock-registers = { version = "0.9", default-features = false, features = [
    "register_types",
], optional = true }
qemu-exit = { version = "3.x.x", optional = true }

# Platform specific dependencies
[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = { version = "10" }

[lib]
name = "libkernel"
test = false
bench = false

##--------------------------------------------------------------------------------------------------
## Stable, harness-free integration test kernels
##--------------------------------------------------------------------------------------------------

[[test]]
name = "01_timer_sanity"
harness = false

[[test]]
name = "02_exception_sync_page_fault"
harness = false

[[test]]
name = "03_exception_restore_sanity"
harness = false

[[test]]
name = "04_exception_irq_sanity"
harness = false

# Disable unit tests for the kernel binary.
[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false
