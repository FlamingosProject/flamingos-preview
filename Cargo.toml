[package]
name = "mingo"
version = "1.0.0"
description = "Virtual Memory, Part 1 — Chapter 10"
keywords = ["virtual-mem-part1"]
authors = ["Andre Richter <andre.o.richter@gmail.com>"]
edition = "2024"

[profile.release]
lto = true

[features]
default = []
bsp_rpi3 = ["tock-registers"]
bsp_rpi4 = ["tock-registers"]
boot_trace = []
test_build = ["qemu-exit"]
chainloader = []

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

##--------------------------------------------------------------------------------------------------
## Dependencies
##--------------------------------------------------------------------------------------------------

[dependencies]
qemu-exit = { version = "3.x.x", optional = true }

# Optional dependencies
[dependencies.tock-registers]
version = "0.9"
default-features = false
features = ["register_types"]
optional = true

# Platform specific dependencies
[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = "10"
