[package]
name = "mingo"
version = "1.0.0"
description = "Safe Globals — Chapter 04"
keywords = ["safe-globals"]
authors = ["Andre Richter <andre.o.richter@gmail.com>"]
edition = "2024"

[profile.release]
lto = true

[features]
default = []
bsp_rpi3 = []
bsp_rpi4 = []
boot_trace = []
test_build = ["qemu-exit"]

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

##--------------------------------------------------------------------------------------------------
## Dependencies
##--------------------------------------------------------------------------------------------------

[dependencies]
qemu-exit = { version = "3.x.x", optional = true }

# Platform specific dependencies
[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = "10.x.x"
