transport select jtag
reset_config trst_and_srst
adapter speed 1000
jtag_ntrst_delay 500

set _CHIPNAME rpi4
set _DAP_TAPID 0x4ba00477
jtag newtap $_CHIPNAME tap -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id $_DAP_TAPID -enable
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.tap

set DBGBASE {0x80410000 0x80510000 0x80610000 0x80710000}
set CTIBASE {0x80420000 0x80520000 0x80620000 0x80720000}

for { set core 0 } { $core < 4 } { incr core } {
    cti create $_CHIPNAME.cti.$core -dap $_CHIPNAME.dap -ap-num 0 \
        -ctibase [lindex $CTIBASE $core]
    target create $_CHIPNAME.core$core aarch64 -dap $_CHIPNAME.dap -coreid $core \
        -dbgbase [lindex $DBGBASE $core] -cti $_CHIPNAME.cti.$core
    $_CHIPNAME.core$core configure -event reset-assert-post "aarch64 dbginit"
    $_CHIPNAME.core$core configure -event gdb-attach { halt }
}
