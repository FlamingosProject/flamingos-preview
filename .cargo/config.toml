[target.'cfg(target="aarch64-unknown-none-softfloat")']
rustflags = [
# Choosing the right target-cpu can produce slightly
# better code, maybe.
#
# Uncomment for your CPU if desired.
# Raspberry Pi 3
# "-C", "target-cpu=cortex-a53",
# Raspberry Pi 4
# "-C", "target-cpu=cortex-a72",
  "-C", "linker=rust-lld",
  "-C", "link-arg=--library-path=kernel/src/bsp/raspberrypi/",
  "-C", "link-arg=--script=kernel.ld",
]

[alias]
xtask = "run -p xtask --"
